[package]
name = "codex-usage-monitor"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "Multi-provider AI usage monitor for the Windows taskbar"
homepage = "https://github.com/darhanger/Codex-Usage-Monitor"
repository = "https://github.com/darhanger/Codex-Usage-Monitor"

[package.metadata.winres]
CompanyName = "Oleksandr Donyk"
ProductName = "Codex Usage Monitor"
FileDescription = "Codex Usage Monitor"
OriginalFilename = "codex-usage-monitor.exe"
InternalName = "CodexUsageMonitor"
Comments = "https://github.com/darhanger/Codex-Usage-Monitor"
LegalCopyright = "Copyright (C) 2026 Oleksandr Donyk"

[dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls", "json", "proxy-from-env"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
]

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
